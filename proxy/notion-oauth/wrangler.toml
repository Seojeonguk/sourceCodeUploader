name = "scu-notion-oauth"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# The comma-separated IDs of the extensions allowed to call the worker.
# - mfhbpmbchemfhijjamldbkidlegfmaff: the unpacked extension. The `key` in manifest.json fixes
#   its ID, so everyone has the same one.
# - kgpilkohekdjpfpcckdlnlolddiheijn: the Chrome Web Store build.
# Register https://<extension-id>.chromiumapp.org/ of each ID as a redirect URI in the
# Notion integration: the worker exchanges the code with the redirect URI of the extension.
ALLOWED_EXTENSION_IDS = "mfhbpmbchemfhijjamldbkidlegfmaff,kgpilkohekdjpfpcckdlnlolddiheijn"

# Set the client ID and secret as secrets, not here:
#   npx wrangler secret put NOTION_CLIENT_ID
#   npx wrangler secret put NOTION_CLIENT_SECRET
