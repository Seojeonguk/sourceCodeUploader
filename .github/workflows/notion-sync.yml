# Writes the issues, pull requests and releases into a Notion database (tools/notion-sync.js).
# Run it by hand (workflow_dispatch) to write every item, such as after creating the database.
# Needs the NOTION_TOKEN and NOTION_DATA_SOURCE_ID secrets; without them it skips.
name: Notion sync

on:
  issues:
    types:
      [
        opened,
        edited,
        deleted,
        closed,
        reopened,
        assigned,
        unassigned,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]
  # pull_request_target has the secrets for pull requests from forks too. It is safe here
  # since the job checks out the base branch and never runs code from the pull request.
  pull_request_target:
    types:
      [
        opened,
        edited,
        closed,
        reopened,
        assigned,
        unassigned,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
        ready_for_review,
        converted_to_draft,
      ]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

# One run at a time per item, so the events of a new item (opened, then labeled) do not each
# create a row. A pending run that is replaced loses nothing: each run reads the item again.
concurrency:
  group: notion-sync-${{ github.event.issue.html_url || github.event.pull_request.html_url || github.event.release.html_url || 'all' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci: the script has no dependencies.
      - run: node tools/notion-sync.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
