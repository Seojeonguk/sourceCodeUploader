# Lint, format check, tests and the Chrome Web Store zip for every pull request and every push to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-zip
          path: dist/*.zip
