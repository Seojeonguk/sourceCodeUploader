# Lint, format check, tests and the Chrome Web Store zip on Node 22 and 24 for every pull request and every push to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    name: ci (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: chrome-web-store-zip
          path: dist/*.zip
